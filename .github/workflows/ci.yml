name: MoonRQA verification
on: [push, pull_request]
permissions:
  contents: read
env:
  MOONBIT_INSTALL_VERSION: "0.10.22+124d61d05"
jobs:
  targets:
    name: target-${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned official MoonBit
        run: |
          curl --retry 2 -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        shell: bash
        run: |
          toolchain="$(moon version --all)"
          printf '%s\n' "$toolchain"
          printf '%s\n' "$toolchain" | grep -Eq '^moon 0\.1\.20261119 \('
          printf '%s\n' "$toolchain" | grep -Eq '^moonc v0\.10\.22\+124d61d05 \('
          printf '%s\n' "$toolchain" | grep -Eq '^moonrun 0\.1\.20261119 \('
      - run: moon check --target "${{ matrix.target }}" --deny-warn
      - run: moon build --target "${{ matrix.target }}" --deny-warn
      - run: moon test --target "${{ matrix.target }}" --deny-warn
      - name: Verify release documentation version
        run: python scripts/verify_release_docs.py
      - name: Verify complete workflows and generated artifacts
        run: python scripts/verify_workflows.py --target "${{ matrix.target }}"
      - name: Verify Chinese README code
        run: moon run tools/readme --target "${{ matrix.target }}" --deny-warn
      - name: Independent exhaustive oracle
        run: python scripts/verify_oracle.py --target "${{ matrix.target }}"
      - if: matrix.target == 'wasm-gc'
        name: Public interface and formatting
        run: |
          moon info
          moon fmt --check
          git diff --exit-code
